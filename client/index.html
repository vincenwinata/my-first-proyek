<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Library</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- App wrapper -->
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">📚</span>
        <h2>Book Library</h2>
      </div>
      <nav>
        <ul>
          <li><a href="#/dashboard"   data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></li>
          <li><a href="#/library"     data-page="library"><span class="nav-icon">📖</span> My Library</a></li>
          <li><a href="#/add-book"    data-page="add-book"><span class="nav-icon">➕</span> Add Book</a></li>
          <li><a href="#/favorites"   data-page="favorites"><span class="nav-icon">⭐</span> Favorites</a></li>
          <li><a href="#/reading-list" data-page="reading-list"><span class="nav-icon">📋</span> Reading List</a></li>
          <li><a href="#/history"     data-page="history"><span class="nav-icon">🕐</span> Reading History</a></li>
          <li><a href="#/statistics"  data-page="statistics"><span class="nav-icon">📈</span> Statistics</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">🌙 Dark Mode</button>
      </div>
    </aside>

    <!-- Main area -->
    <div class="main-area">
      <!-- Top bar (mobile) -->
      <header class="topbar">
        <button id="menu-toggle" class="menu-btn" aria-label="Open menu">☰</button>
        <h1 class="topbar-title">Book Library</h1>
      </header>

      <!-- Page content -->
      <main class="content" id="content">
        <!-- Pages rendered here by JS -->
      </main>
    </div>
  </div>

  <!-- Modal overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
